<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        // Function that returns a Promise
function checkMarks(marks) {
    return new Promise((resolve, reject) => {
        setTimeout(() => {
            if (marks >= 35) {
                resolve(`You passed with ${marks} marks! 🎉`);
            } else {
                reject(`You failed with ${marks} marks. 😢`);
            }
        }, 2000); // Simulating delay (like API call)
    });
}

// Using async/await to handle it
async function result() {
    try {
        let message = await checkMarks(20); // Change to 50 to see resolve
        console.log("Success:", message);
    } catch (error) {
        console.log("Error:", error);
    }
}

result();


    </script>
</body>
</html>

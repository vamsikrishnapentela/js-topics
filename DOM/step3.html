<!DOCTYPE html>
<html>
<head>
  <title>Step 3 - Change Style</title>
</head>
<body>

  <h1 id="heading">Style Me</h1>
  <button onclick="makeRed()">Make Red</button>
  <button onclick="makeBig()">Make Big</button>

<script>
  function makeRed() {
    document.getElementById("heading").style.color = "red";
  }

  function makeBig() {
    document.getElementById("heading").style.fontSize = "50px";
  }
</script>

</body>
</html>
